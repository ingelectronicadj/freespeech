name: Build
on:
  push:
    branches:
      - master
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vueapp/package-lock.json
      - name: npm install
        run: cd vueapp && npm ci
      - name: lint
        run: cd vueapp && npm run lint:nofix
      - name: unit tests
        run: cd vueapp && npm run test:unit
      - name: production build
        run: cd vueapp && npm run build
